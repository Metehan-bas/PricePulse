<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giriş Yap | PricePulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main class="flex min-h-screen items-center justify-center px-4 py-10">
      <section class="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
        <a href="{{ url_for('mainpage') }}" class="text-3xl font-bold text-violet-400">PricePulse</a>
        <h1 class="mt-8 text-3xl font-bold">Hesabına giriş yap</h1>
        <p class="mt-2 text-sm text-slate-400">Favori ürünlerini ve fiyatlarını görüntüle.</p>

        {% if error %}
          <div role="alert" class="mt-6 rounded-xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-200">
            {{ error }}
          </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="mt-6 space-y-5">
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-200">E-posta</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              autofocus
              class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20"
              placeholder="ornek@email.com"
            />
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-200">Şifre</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20"
              placeholder="Şifren"
            />
          </div>

          <button type="submit" class="w-full rounded-xl bg-violet-600 px-5 py-3 font-semibold transition hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-400">
            Giriş Yap
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-400">
          Hesabın yok mu?
          <a href="{{ url_for('signup') }}" class="font-semibold text-violet-400 hover:text-violet-300">Kayıt ol</a>
        </p>
      </section>
    </main>
  </body>
</html>
